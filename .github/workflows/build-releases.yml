name: Build Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: rugby-referee-review-linux
            asset_name: rugby-referee-review-linux.tar.gz
            exe_name: rugby-referee-review
          - os: windows-latest
            artifact_name: rugby-referee-review-windows
            asset_name: rugby-referee-review-windows.zip
            exe_name: Rugby Referee Review.exe
          - os: macos-latest
            artifact_name: rugby-referee-review-macos
            asset_name: rugby-referee-review-macos.zip
            exe_name: Rugby Referee Review

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          pyinstaller --onefile --windowed --name "Rugby Referee Review" --icon NONE referee_review_app.py
          dir dist

      - name: Build with PyInstaller (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --onefile --windowed --name "${{ matrix.exe_name }}" referee_review_app.py
          ls -la dist/

      - name: Create release folder
        run: mkdir release

      - name: Copy files (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Copy-Item "dist\Rugby Referee Review.exe" -Destination "release\"
          Copy-Item "README.md" -Destination "release\" -ErrorAction SilentlyContinue
          Copy-Item "QUICK_START.md" -Destination "release\" -ErrorAction SilentlyContinue

      - name: Copy files (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          cp "dist/${{ matrix.exe_name }}" release/
          cp README.md release/ 2>/dev/null || true
          cp QUICK_START.md release/ 2>/dev/null || true

      - name: Package Windows release
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Compress-Archive -Path "release\*" -DestinationPath "${{ matrix.asset_name }}"

      - name: Package macOS release
        if: matrix.os == 'macos-latest'
        run: |
          cd release && zip -r ../${{ matrix.asset_name }} *

      - name: Package Linux release
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd release && tar -czf ../${{ matrix.asset_name }} *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -f "RELEASE_NOTES.md" ]; then
            gh release create "$TAG_NAME" \
              --title "Rugby Referee Review $TAG_NAME" \
              --notes-file "RELEASE_NOTES.md" \
              rugby-referee-review-windows/rugby-referee-review-windows.zip \
              rugby-referee-review-macos/rugby-referee-review-macos.zip \
              rugby-referee-review-linux/rugby-referee-review-linux.tar.gz
          else
            gh release create "$TAG_NAME" \
              --title "Rugby Referee Review $TAG_NAME" \
              --notes "Download the version for your operating system." \
              rugby-referee-review-windows/rugby-referee-review-windows.zip \
              rugby-referee-review-macos/rugby-referee-review-macos.zip \
              rugby-referee-review-linux/rugby-referee-review-linux.tar.gz
          fi