name: Build Releases

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v1.1.0, etc.
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: orra-referee-review-linux
            asset_name: orra-referee-review-linux.tar.gz
          - os: windows-latest
            artifact_name: orra-referee-review-windows
            asset_name: orra-referee-review-windows.zip
          - os: macos-latest
            artifact_name: orra-referee-review-macos
            asset_name: orra-referee-review-macos.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl

      - name: Build executable with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --windowed --name="ORRA Referee Review" --icon=NONE referee_review_app.py
          mkdir release
          copy dist\\"ORRA Referee Review.exe" release\\
          copy README.md release\\
          copy QUICK_START.md release\\

      - name: Build executable with PyInstaller (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --onefile --windowed --name="ORRA Referee Review" referee_review_app.py
          mkdir release
          cp "dist/ORRA Referee Review" release/
          cp README.md release/
          cp QUICK_START.md release/

      - name: Build executable with PyInstaller (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --onefile --windowed --name="orra-referee-review" referee_review_app.py
          mkdir release
          cp dist/orra-referee-review release/
          cp README.md release/
          cp QUICK_START.md release/

      - name: Package Windows release
        if: matrix.os == 'windows-latest'
        run: |
          cd release
          7z a ../${{ matrix.asset_name }} *

      - name: Package macOS release
        if: matrix.os == 'macos-latest'
        run: |
          cd release
          zip -r ../${{ matrix.asset_name }} *

      - name: Package Linux release
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd release
          tar -czf ../${{ matrix.asset_name }} *

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ORRA Referee Review ${{ github.ref_name }}
          body: |
            # ORRA Referee Review System ${{ github.ref_name }}
            
            ## Downloads
            Choose the version for your operating system:
            
            - **Windows**: Download `orra-referee-review-windows.zip`
            - **macOS**: Download `orra-referee-review-macos.zip`
            - **Linux**: Download `orra-referee-review-linux.tar.gz`
            
            ## Installation
            
            ### Windows
            1. Download and extract the zip file
            2. Double-click "ORRA Referee Review.exe"
            3. No Python installation required!
            
            ### macOS
            1. Download and extract the zip file
            2. Right-click "ORRA Referee Review" and select "Open"
            3. Click "Open" in the security dialog
            4. No Python installation required!
            
            ### Linux
            1. Download and extract the tar.gz file
            2. Make executable: `chmod +x orra-referee-review`
            3. Run: `./orra-referee-review`
            4. No Python installation required!
            
            ## What's New
            - Based on Community Rugby Referee Development Framework (CRRDF)
            - All 5 pillars with 15 guided questions
            - 10 GFA aspects with detailed descriptions
            - Export to Excel in ORRA format
            
            ## Documentation
            See README.md in the download for complete documentation.
          draft: false
          prerelease: false

      - name: Upload Windows Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./orra-referee-review-windows/orra-referee-review-windows.zip
          asset_name: orra-referee-review-windows.zip
          asset_content_type: application/zip

      - name: Upload macOS Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./orra-referee-review-macos/orra-referee-review-macos.zip
          asset_name: orra-referee-review-macos.zip
          asset_content_type: application/zip

      - name: Upload Linux Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./orra-referee-review-linux/orra-referee-review-linux.tar.gz
          asset_name: orra-referee-review-linux.tar.gz
          asset_content_type: application/gzip
