name: Build Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: rugby-referee-review-linux
            asset_name: rugby-referee-review-linux.tar.gz
          - os: windows-latest
            artifact_name: rugby-referee-review-windows
            asset_name: rugby-referee-review-windows.zip
          - os: macos-latest
            artifact_name: rugby-referee-review-macos
            asset_name: rugby-referee-review-macos.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl ttkbootstrap pillow

      - name: Build executable with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --windowed --name="Rugby Referee Review" --icon=NONE referee_review_app.py
          mkdir release
          copy dist\\"Rugby Referee Review.exe" release\\
          copy README.md release\\
          copy QUICK_START.md release\\

      - name: Build executable with PyInstaller (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --onefile --windowed --name="Rugby Referee Review" referee_review_app.py
          mkdir release
          cp "dist/Rugby Referee Review" release/
          cp README.md release/
          cp QUICK_START.md release/

      - name: Build executable with PyInstaller (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --onefile --windowed --name="rugby-referee-review" referee_review_app.py
          mkdir release
          cp dist/rugby-referee-review release/
          cp README.md release/
          cp QUICK_START.md release/

      - name: Package Windows release
        if: matrix.os == 'windows-latest'
        run: |
          cd release
          7z a ../${{ matrix.asset_name }} *

      - name: Package macOS release
        if: matrix.os == 'macos-latest'
        run: |
          cd release
          zip -r ../${{ matrix.asset_name }} *

      - name: Package Linux release
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd release
          tar -czf ../${{ matrix.asset_name }} *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Rugby Referee Review $TAG_NAME" \
            --notes "Download the version for your operating system. See README.md for installation instructions." \
            rugby-referee-review-windows/rugby-referee-review-windows.zip \
            rugby-referee-review-macos/rugby-referee-review-macos.zip \
            rugby-referee-review-linux/rugby-referee-review-linux.tar.gz